<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#334155"/></marker></defs>
  <style>
    text { font-family: Arial, sans-serif; fill:#0f172a; font-size:18px }
    .title { font-size:26px; font-weight:bold }
    .package { font-size:23px; font-weight:bold }
    .small { font-size:15px; fill:#475569 }
    .box { fill:#fff; stroke:#334155; stroke-width:2; rx:8 }
    .group { fill:#f1f5f9; stroke:#94a3b8; stroke-width:2; rx:12 }
    .edge { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow) }
  </style>
  <text x="32" y="38" class="title">Variant 16  Video Game Matchmaking  Class Diagram</text>

  <rect x="670" y="58" width="260" height="54" class="box"/><text x="708" y="91">Main  Client CLI</text>
  <rect x="280" y="166" width="320" height="66" class="box"/><text x="320" y="204">MatchmakingFacade</text>
  <rect x="1000" y="166" width="310" height="66" class="box"/><text x="1072" y="204">AdminFacade</text>
  <path d="M 738 112 L 510 166" class="edge"/><path d="M 862 112 L 1080 166" class="edge"/>
  <path d="M 1000 199 L 600 199" class="edge"/>
  <text x="722" y="190" class="small">requires / compensates</text>

  <rect x="645" y="260" width="310" height="55" class="box"/><text x="760" y="294">Workflow</text>
  <path d="M 500 232 L 705 260" class="edge"/>

  <rect x="35" y="425" width="490" height="445" class="group"/>
  <text x="64" y="461" class="package">A  Party reservation</text>
  <rect x="70" y="485" width="420" height="64" class="box"/><text x="93" y="515">PartyService</text><text x="93" y="537" class="small">reserve / cancel / inspect</text>
  <rect x="70" y="580" width="420" height="55" class="box"/><text x="93" y="613">RatingRule  business logic</text>
  <rect x="70" y="665" width="420" height="55" class="box"/><text x="93" y="698">PartyRepository  persistence gateway</text>
  <rect x="70" y="750" width="420" height="85" class="box"/><text x="93" y="785">PartyTicket  entity</text><text x="93" y="812" class="small">NEW  →  RESERVED  →  CANCELLED</text>

  <rect x="555" y="425" width="490" height="445" class="group"/>
  <text x="584" y="461" class="package">B  Server allocation</text>
  <rect x="590" y="485" width="420" height="64" class="box"/><text x="613" y="515">ServerService</text><text x="613" y="537" class="small">allocate / release / inspect</text>
  <rect x="590" y="580" width="420" height="55" class="box"/><text x="613" y="613">LatencyRule  business logic</text>
  <rect x="590" y="665" width="420" height="55" class="box"/><text x="613" y="698">ServerRepository  persistence gateway</text>
  <rect x="590" y="750" width="420" height="85" class="box"/><text x="613" y="785">ServerAllocation  entity</text><text x="613" y="812" class="small">NEW  →  ALLOCATED  →  RELEASED</text>

  <rect x="1075" y="425" width="490" height="445" class="group"/>
  <text x="1104" y="461" class="package">C  Match confirmation</text>
  <rect x="1110" y="485" width="420" height="64" class="box"/><text x="1133" y="515">MatchService</text><text x="1133" y="537" class="small">confirm / revoke / inspect</text>
  <rect x="1110" y="580" width="420" height="55" class="box"/><text x="1133" y="613">AntiCheatRule  business logic</text>
  <rect x="1110" y="665" width="420" height="55" class="box"/><text x="1133" y="698">MatchRepository  persistence gateway</text>
  <rect x="1110" y="750" width="420" height="85" class="box"/><text x="1133" y="785">MatchRecord  entity</text><text x="1133" y="812" class="small">NEW  →  CONFIRMED  →  REVOKED</text>

  <path d="M 350 232 L 280 485" class="edge"/><path d="M 440 232 L 800 485" class="edge"/><path d="M 540 232 L 1320 485" class="edge"/>
  <path d="M 1090 232 L 400 485" class="edge"/><path d="M 1155 232 L 900 485" class="edge"/><path d="M 1240 232 L 1400 485" class="edge"/>
  <path d="M 280 549 L 280 580" class="edge"/><path d="M 355 549 L 355 665" class="edge"/><path d="M 160 549 L 160 750" class="edge"/>
  <path d="M 800 549 L 800 580" class="edge"/><path d="M 875 549 L 875 665" class="edge"/><path d="M 680 549 L 680 750" class="edge"/>
  <path d="M 1320 549 L 1320 580" class="edge"/><path d="M 1395 549 L 1395 665" class="edge"/><path d="M 1200 549 L 1200 750" class="edge"/>
  <path d="M 280 720 L 280 750" class="edge"/><path d="M 800 720 L 800 750" class="edge"/><path d="M 1320 720 L 1320 750" class="edge"/>

  <rect x="650" y="920" width="300" height="55" class="box"/><text x="674" y="955">Store  atomic JSON I/O</text>
  <path d="M 180 720 L 180 905 L 700 920" class="edge"/>
  <path d="M 800 720 L 800 920" class="edge"/>
  <path d="M 1420 720 L 1420 905 L 900 920" class="edge"/>
  <path d="M 600 220 L 1570 220 L 1570 905 L 950 943" class="edge"/>
  <text x="30" y="985" class="small">Arrows show direct calls or persisted entity use. The three subsystems have no dependencies on each other.</text>
</svg>
